# ConstructsHub production-shaped compose (launch-blocker §5.1-5).
#
# What this gives you locally:
#   waquor-db       — Postgres 16 with volume + healthcheck
#   waquor-migrate  — short-lived container running `prisma migrate deploy`
#   waquor          — Next.js app on :3000, depends on migrate completion
#   bim-parser      — hardened IFC sandbox (no net, read-only root, tmpfs)
#   bim-proxy       — nginx reverse-proxy that fronts the sandbox (:8081)
#
# Reproduces staging topology on one host so humans and act (nektos/act) can
# both exercise the pipeline end-to-end. Secrets come from the environment,
# never from a baked `.env`. Only POSTGRES_PASSWORD is required to boot.
#
# Usage:
#   export POSTGRES_PASSWORD=... NEXTAUTH_SECRET=... BIM_SERVICE_TOKEN=...
#   docker compose -f docker-compose.production.yml up -d --build
#   docker compose -f docker-compose.production.yml ps        # all healthy
#   curl -fsS http://127.0.0.1:3000/api/health                # {"status":"ok",...}

name: constructhub

services:

  waquor-db:
    image: postgres:16-alpine
    container_name: constructhub-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-constructhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env}
      POSTGRES_DB: ${POSTGRES_DB:-constructhub}
    volumes:
      - waquor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-constructhub} -d ${POSTGRES_DB:-constructhub}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - waquor-net

  # One-shot container: `prisma migrate deploy` runs before `waquor` boots.
  # Mirrors the k8s pre-rollout migration Job (deploy/k8s/staging/20-migration-job.yaml).
  # Built from the `migrate` stage so the full node_modules tree is present
  # (Prisma CLI needs jiti + @prisma/config at runtime, which are pruned
  # from the standalone Next bundle used by the serving container).
  waquor-migrate:
    build:
      context: ./waquor
      dockerfile: Dockerfile
      target: migrate
    image: constructhub/waquor-migrate:latest
    container_name: constructhub-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-constructhub}:${POSTGRES_PASSWORD}@waquor-db:5432/${POSTGRES_DB:-constructhub}?schema=public
    depends_on:
      waquor-db:
        condition: service_healthy
    restart: "no"
    networks:
      - waquor-net

  waquor:
    image: constructhub/waquor:latest
    container_name: constructhub-web
    build:
      context: ./waquor
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: postgresql://${POSTGRES_USER:-constructhub}:${POSTGRES_PASSWORD}@waquor-db:5432/${POSTGRES_DB:-constructhub}?schema=public
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET in your env}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # Optional provider env — unset providers are silently skipped by
      # lib/notify-* per the SRS §9.3 contract.
      BIM_SERVICE_URL: http://bim-proxy:8081
      BIM_HMAC_SECRET: ${BIM_SERVICE_TOKEN:-}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    depends_on:
      waquor-db:
        condition: service_healthy
      waquor-migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"
    read_only: false     # Next writes to .next/cache at runtime
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=4 http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - waquor-net
      - waquor-bim

  # Sandboxed BIM parser (SRS §6.5, NFR-SEC-11).
  # Identical hardening to services/bim/docker-compose.yml, folded in here so a
  # single production compose runs the full stack.
  bim-parser:
    build:
      context: ./services/bim
    image: constructhub/bim:latest
    container_name: constructhub-bim
    environment:
      BIM_SERVICE_TOKEN: ${BIM_SERVICE_TOKEN:?set BIM_SERVICE_TOKEN in your env}
      BIM_MAX_UPLOAD_BYTES: "2147483648"
    read_only: true
    tmpfs:
      - /uploads:size=4g,uid=10001,gid=10001,mode=1700
      - /tmp:size=64m,uid=10001,gid=10001,mode=1700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 4g
    pids_limit: 256
    networks:
      - waquor-bim-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      retries: 3

  bim-proxy:
    image: nginx:1.27-alpine
    container_name: constructhub-bim-proxy
    depends_on:
      bim-parser:
        condition: service_healthy
    networks:
      - waquor-bim-internal
      - waquor-bim
    configs:
      - source: bim_nginx
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --tries=1 --timeout=3 http://127.0.0.1:8081/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

configs:
  bim_nginx:
    content: |
      server {
        listen 8081;
        client_max_body_size 2048m;
        proxy_read_timeout 300s;
        location / {
          proxy_pass http://bim-parser:8081;
          # $$ escapes the dollar from compose interpolation so nginx receives
          # the literal $http_* request-header variables.
          proxy_set_header X-BIM-Timestamp $$http_x_bim_timestamp;
          proxy_set_header X-BIM-Signature $$http_x_bim_signature;
          proxy_set_header Content-Type $$http_content_type;
        }
      }

volumes:
  waquor_pgdata:

networks:
  waquor-net:
    driver: bridge
  waquor-bim:
    driver: bridge
  # bim-parser lives only on this network, which has no gateway: no outbound
  # internet reachable from the IFC sandbox. bim-proxy bridges in from
  # waquor-bim.
  waquor-bim-internal:
    driver: bridge
    internal: true
