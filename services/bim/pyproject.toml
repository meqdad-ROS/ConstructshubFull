[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "constructhub-bim"
version = "0.1.0"
description = "BanahBuild / ConstructsHub — sandboxed IfcOpenShell parsing service (SRS §6.5, NFR-SEC-11)"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "ConstructsHub" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.17",
    "pydantic>=2.9",
    "ifcopenshell>=0.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
