kind: CronJob
metadata:
  name: cron-dispatch-social
  namespace: constructhub-staging
  labels:
    app: cron
    job: dispatch-social
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 240
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: curl
              image: curlimages/curl:8.11.1
              imagePullPolicy: IfNotPresent
              env:
                - name: CRON_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: cron-secrets
                      key: CRON_DISPATCH_SECRET
              command: ["sh", "-c"]
              args:
                - |
                  curl -fsS --max-time 180 \
                    -X POST \
                    -H "x-cron-secret: $CRON_SECRET" \
                    http://waquor.constructhub-staging.svc.cluster.local/api/cron/dispatch-social
              resources:
