# Template for the two Secrets the staging deployment reads via envFrom.
#
# Do NOT commit real values. Replace the base64 placeholders with real ones at
# apply time (e.g. `kubectl -n constructhub-staging create secret generic
# waquor-secrets --from-env-file=./secrets.env --dry-run=client -o yaml |
# kubectl apply -f -`), or sync from Vault / External Secrets Operator.
#
# These two secrets map to the envFrom references in 30-waquor-deployment.yaml
# and 20-migration-job.yaml. Every env ref is a Secret ref — no plaintext in
# the Deployment spec.
apiVersion: v1
kind: Secret
metadata:
  name: waquor-secrets
  namespace: constructhub-staging
type: Opaque
stringData:
  # Postgres connection — the migration Job uses the same URL.
  DATABASE_URL: "postgresql://REPLACE:REPLACE@waquor-db:5432/constructhub?schema=public"
  # NextAuth
  NEXTAUTH_SECRET: "REPLACE-with-openssl-rand-base64-32"
  NEXTAUTH_URL: "https://staging.constructhub.example.com"
  # Public base URL used by lib/notify-events to build links.
  NEXT_PUBLIC_BASE_URL: "https://staging.constructhub.example.com"
  # Any other provider secrets go here — unset keys are skipped silently by
  # the notify / payment registries, so staging can start without them.
  # SENDGRID_API_KEY: ""
  # TWILIO_AUTH_TOKEN: ""
  # STRIPE_SECRET_KEY: ""
  # ZATCA_PRIVATE_KEY_PEM: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: bim-secrets
  namespace: constructhub-staging
type: Opaque
stringData:
  # Shared with the waquor Deployment as BIM_HMAC_SECRET.
  BIM_SERVICE_TOKEN: "REPLACE-with-openssl-rand-hex-32"
