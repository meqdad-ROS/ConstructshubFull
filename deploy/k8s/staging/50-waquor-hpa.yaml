# HPA: scale 2–8 by CPU utilisation. Memory stays below the limit under
# normal load; Next.js is CPU-bound in staging (SSR + prisma).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: waquor
  namespace: constructhub-staging
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waquor
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max
